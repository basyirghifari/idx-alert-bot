name: IDX Stock Alert Check

on:
  schedule:
    # Every 15 min, Mon-Fri, 02:00-08:59 UTC.
    # IDX trading hours are 09:00-15:49 WIB (UTC+7), split into two
    # sessions with a lunch break. WIB has no daylight saving, so this
    # window is fixed year-round (unlike the US stock bot's cron).
    - cron: "*/15 2-8 * * 1-5"
  workflow_dispatch: {}  # lets you trigger it manually from the Actions tab

permissions:
  contents: write  # needed so the workflow can commit updated state.json

jobs:
  check-idx-alerts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run alert check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python src/main.py

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || git commit -m "Update alert state [skip ci]"
          git push
